services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lagrange-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lagrange-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
